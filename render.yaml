services:
  - type: web
    name: hosp-predict-api
    runtime: python
    plan: free
    branch: develop
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: '3.13.18'
      - key: UV_VERSION
        value: '0.13.9'
      - key: CORS_ORIGINS
        sync: false
